[project]
name = "speech-segmentation"
version = "0.1.0"
description = "Speech segmentation and speaker identification library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kokoro-onnx>=0.5.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "piper-tts>=1.4.2",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "deno>=2.9.0",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]
export = [
    "onnx>=1.21.0",
    "onnxscript>=0.7.0",
    "speechbrain>=1.1.0",
    "torch",
]
vae = [
    "torch",
]
demo = [
    "kittentts",
    "scikit-learn>=1.8.0",
    "transformers>=5.9.0",
]

[tool.uv.sources]
kittentts = { url = "https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech_segmentation"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["I"]
